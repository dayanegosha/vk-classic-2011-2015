<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ВК Классика</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img class="classic-logo" src="assets/classic-logo.gif" width="145" height="42" alt="ВКонтакте"><span class="year">2011–2015</span></header>
  <main>
    <div class="intro"><div><h1>Тот самый ВКонтакте.</h1><p>Знакомый вид. Твои нынешние друзья.</p></div></div>
    <label class="master"><span><b>Классический дизайн</b><small id="status" role="status">Проверяем текущую вкладку…</small></span><input id="enabled" type="checkbox" role="switch" checked><span class="switch" aria-hidden="true"></span></label>
    <fieldset id="appearance"><legend>Оформление</legend>
      <label class="row"><span>Ширина страницы</span><select id="width"><option value="800" selected>800 · как раньше</option><option value="900">900 · удобно</option><option value="1040">1040 · просторнее</option></select></label>
      <label class="row"><span>Размер текста</span><select id="fontSize"><option value="11" selected>11 px · оригинал</option><option value="12">12 px</option><option value="13">13 px</option><option value="14">14 px</option></select></label>
      <label class="option"><input id="squareAvatars" type="checkbox" checked><span>Квадратные аватарки</span></label>
      <label class="option"><input id="classicMenu" type="checkbox" checked><span>Меню «Моя страница / Мои друзья»</span></label>
      <label class="option"><input id="classicProfile" type="checkbox" checked><span>Фото профиля слева, без обложки</span></label>
      <label class="option"><input id="hideStories" type="checkbox" checked><span>Скрыть истории</span></label>
      <label class="option"><input id="hideFeedSidebar" type="checkbox" checked><span>Убрать правую колонку в новостях</span></label>
    </fieldset>
    <p class="hint">Настройки применяются сразу на vk.ru и vk.com. После первой установки обнови уже открытый ВК.</p>
    <div class="bottom"><button id="reset" type="button">Вернуть настройки</button><span id="saved" role="status" aria-live="polite"></span></div>
  </main>
  <footer>Без аналитики и сторонних серверов.<br>Неофициальное расширение.</footer>
  <script src="settings.js"></script><script src="popup.js"></script>
</body>
</html>
